# Nginx конфигурация для IKEYA Frontend
# Разместить в /etc/nginx/sites-available/ikea_front.conf
# Создать симлинк: ln -s /etc/nginx/sites-available/ikea_front.conf /etc/nginx/sites-enabled/

upstream ikea_front {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name 45.135.234.22;

    # Логи
    access_log /var/log/nginx/ikea_front_access.log;
    error_log /var/log/nginx/ikea_front_error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 20M;

    # Проксирование на Next.js приложение
    location /ikea_front/ {
        proxy_pass http://ikea_front/ikea_front/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Редирект с /ikea_front на /ikea_front/
    location = /ikea_front {
        return 301 /ikea_front/;
    }

    # Статические файлы Next.js
    location /ikea_front/_next/static {
        proxy_pass http://ikea_front;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }

    # Статические файлы из public
    location /ikea_front/assets {
        proxy_pass http://ikea_front;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600";
    }
}

